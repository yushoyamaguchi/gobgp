[global.config]
  as = 65000
  router-id = "1.1.1.1"

[[neighbors]]
  [neighbors.config]
    neighbor-address = "10.0.0.2"
    peer-as = 65001

  [neighbors.apply-policy.config]
    export-policy-list = ["export-connected"]

[[defined-sets.prefix-sets]]
  prefix-set-name = "connected-routes"
  [[defined-sets.prefix-sets.prefix-list]]
    ip-prefix = "10.0.0.0/24"
    masklength-range = "24..24"
  [[defined-sets.prefix-sets.prefix-list]]
    ip-prefix = "192.168.1.0/24"
    masklength-range = "24..24"

[[policy-definitions]]
  name = "export-connected"
  [[policy-definitions.statements]]
    name = "allow-connected"
    [policy-definitions.statements.conditions.match-prefix-set]
      prefix-set = "connected-routes"
    [policy-definitions.statements.actions]
      route-disposition = "accept-route"